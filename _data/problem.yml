section_id: "problem"
heading: "A tool designed by a literary translator, <strong>specifically for their peers</strong>,"
subheading: "...built arround questions every translators has when a translation project ramps up:"

pain_points:
  - id: "how-long"
    title: "How long it will take?"
    description: "See how much of the text you have translated so far, see how much pages you need to translate per day to meet the deadline. Balance multiple projects overivew in one easy dashboard."
    icon: "grid_off"

  - id: "how-much"
    title: "How much will I make?"
    description: "Financial analytics calculates all your projet earnings based on character counts (with spaces) or standardized pages while deducting taxes and pension and health insurance contributions."
    icon: "pin"

  - id: "any-mistake"
    title: "Am I making any mistake?"
    description: "Long-form prose requires patient and repeated re-readings. Our intelligent AI assistant makes that process easier with glossary checks, idiom suggestions and spot on inline commentary."
    icon: "schedule"